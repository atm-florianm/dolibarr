<div class="contact-card">
    <div class="section-title">
        ${ContactInformation}
    </div>
    <section class="contact-info">
        <div>
            Nom : ${civility} ${firstname} ${lastname}
        </div><span></span>

        <div class="${[hideEmpty v='poste']}">
            Poste : ${poste}
        </div><span></span>


        <div class="${[hideEmpty v='email']}">
            E-mail : ${email}
        </div><span></span>


        <div class="${[hideEmpty v='phone']}">
            Téléphone : ${phone}
        </div><span></span>


        <div class="${[hideEmpty v='phone_mobile']}">
            Mobile : ${phone_mobile}
        </div><span></span>

        
        <div class="${[hideEmpty v='address']}">
            Adresse : ${address} - ${zip} ${town}
        </div><span></span>
    </section>

    <div class="company-info">
        <div class="section-title">${CompanyInformation}</div>
        <div>
            ${Company}:
            <span class="value">${socname}</span>
        </div>
    </div>

    <div class="notes">
        <div class="section-title">${Notes}</div>
        <div>${note_public}</div>
    </div>

</div>
